apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitored-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: web-server
        image: nginx:alpine
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"